function daysHours(dateStr){
  const target=new Date(dateStr+'T09:00:00').getTime();
  const diff=target-Date.now();
  if(diff<=0) return 'today';
  const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000);
  return d>0 ? (d+'d '+h+'h') : (h+'h');
}

function taskId(dateStr,idx){ return dateStr+'-'+idx; }

function progressRing(pct,size){
  size=size||90;
  const r=(size-10)/2, c=2*Math.PI*r, off=c-(pct/100)*c;
  return '<svg width="'+size+'" height="'+size+'" class="ring">'
    +'<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--blush)"/></linearGradient></defs>'
    +'<circle class="ring-bg" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'"/>'
    +'<circle class="ring-fg" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    +'</svg>';
}

function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function timerTotals(){
  const today=new Date().toISOString().slice(0,10);
  const weekAgo=Date.now()-7*86400000;
  const todayMin=STATE.timerLog.filter(function(l){return l.date===today;}).reduce(function(a,l){return a+l.min;},0);

  const totalMin=STATE.timerLog.reduce(function(a,l){return a+l.min;},0);
  return '<div class="grid2"><div class="taskmeta">Today: <b style="color:var(--ink)">'+todayMin+' min</b></div><div class="taskmeta">This week: <b style="color:var(--ink)">'+weekMin+' min</b></div><div class="taskmeta">All-time: <b style="color:var(--ink)">'+totalMin+' min</b></div><div class="taskmeta">Sessions: <b style="color:var(--ink)">'+STATE.timerLog.length+'</b></div></div>';

      h+='<div class="card"><div class="taskmeta">'+m.date+' · <span class="pill p1">'+m.category+'</span></div><div style="font-weight:600;margin-top:4px;">'+m.topic+'</div><div style="font-size:13.5px;margin-top:2px;">'+m.q+'</div><div class="taskmeta" style="margin-top:4px;">Mine: '+m.mine+' → Correct: '+m.correct+'</div><div class="taskmeta">'+m.why+'</div></div>';
    });
  } else { h+='<div class="emptystate">No mistakes logged yet.</div>'; }
  return h;
}

function pageConfidence(){
  let h='<h2 class="sectiontitle">Confidence Tracker</h2><div class="sectionsub">1 = don\'t understand · 5 = can handle interview follow-ups. A drop is information, not failure.</div><div class="card">';
  CONFIDENCE_SUBJECTS.forEach(function(s){
    const v=STATE.confidence[s]||1;
    h+='<div class="bar-row"><div class="bar-label">'+s+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(v*20)+'%"></div></div><select data-conf="'+s+'" style="width:56px;">';
    [1,2,3,4,5].forEach(function(n){ h+='<option value="'+n+'" '+(n==v?'selected':'')+'>'+n+'</option>'; });
    h+='</select></div>';
  });
  h+='</div>';
  return h;
}

function pageProgress(){
  const totalTasks=DAY_PLAN.reduce(function(a,d){return a+d.items.length;},0);
  const doneTasks=DAY_PLAN.reduce(function(a,d){return a+d.items.filter(function(it,i){return STATE.tasksDone[taskId(d.date,i)];}).length;},0);
  const dsaSolved=Object.keys(STATE.dsaStatus).filter(function(k){return STATE.dsaStatus[k]>=3;}).length;
  const dsaTotal=DSA_TOPICS.reduce(function(a,t){return a+t.probs.length;},0);
  const confAvg=CONFIDENCE_SUBJECTS.reduce(function(a,s){return a+(STATE.confidence[s]||1);},0)/CONFIDENCE_SUBJECTS.length;
  const mastered=CONFIDENCE_SUBJECTS.filter(function(s){return (STATE.confidence[s]||1)>=5;}).length;
  const totalMin=STATE.timerLog.reduce(function(a,l){return a+l.min;},0);
  const overall=Math.round(((totalTasks?doneTasks/totalTasks:0)*50)+((confAvg/5)*50));
  let h='<h2 class="sectiontitle">Progress</h2><div class="sectionsub">Preparation coverage, not a grade.</div>';
  h+='<div class="card" style="display:flex;align-items:center;gap:18px;">'+progressRing(overall,100)+'<div><h3>Overall preparation</h3><div class="taskmeta">'+overall+'% of plan + confidence combined</div></div></div>';
  h+='<div class="card">';
  h+='<div class="bar-row"><div class="bar-label">Study plan tasks</div><div class="bar-track"><div class="bar-fill" style="width:'+(totalTasks?doneTasks/totalTasks*100:0)+'%"></div></div><div class="bar-val">'+doneTasks+'/'+totalTasks+'</div></div>';
  h+='<div class="bar-row"><div class="bar-label">DSA problems</div><div class="bar-track"><div class="bar-fill" style="width:'+(dsaTotal?dsaSolved/dsaTotal*100:0)+'%"></div></div><div class="bar-val">'+dsaSolved+'/'+dsaTotal+'</div></div>';
  h+='<div class="bar-row"><div class="bar-label">Subjects mastered</div><div class="bar-track"><div class="bar-fill" style="width:'+(mastered/CONFIDENCE_SUBJECTS.length*100)+'%"></div></div><div class="bar-val">'+mastered+'/'+CONFIDENCE_SUBJECTS.length+'</div></div>';
  h+='</div><div class="card grid2"><div><div class="taskmeta">Total focused minutes</div><div style="font-family:\'Fraunces\',serif;font-size:20px;">'+totalMin+'</div></div><div><div class="taskmeta">Mocks completed</div><div style="font-family:\'Fraunces\',serif;font-size:20px;">'+STATE.mocks.length+'</div></div></div>';
  return h;
}

function pageNotes(){
  const list=STATE.notes;
  let h='<h2 class="sectiontitle">My Own Knowledge</h2>';
  h+='<div class="note">Your own notes may be more useful than another tutorial. Before learning something fresh, check: do I already have college notes for this? Did a professor or senior explain it differently? Can I explain it without looking at this site?</div>';
  h+='<div class="card"><div class="grid2"><div class="field"><label class="f">Topic / tag</label><input type="text" id="nTopic"></div><div class="field"><label class="f">Link (optional)</label><input type="text" id="nLink"></div></div>';
  h+='<div class="field"><label class="f">Note</label><textarea rows="3" id="nText"></textarea></div><button class="btn sage" id="addNote">Save note</button></div>';
  const rev=list.slice().reverse();
  if(rev.length){
    rev.forEach(function(n){
      h+='<div class="card"><div class="taskmeta">'+n.date+' · '+n.topic+'</div><div style="font-size:13.5px;margin-top:2px;">'+n.text+'</div>'+(n.link?'<a href="'+n.link+'" target="_blank" rel="noopener" style="font-size:12.5px;">'+n.link+'</a>':'')+'</div>';
    });
  } else { h+='<div class="emptystate">No notes yet.</div>'; }
  return h;
}

function pageInterview(){
  let h='<h2 class="sectiontitle">Interview Mode</h2><div class="sectionsub">Distractions off. One question at a time. Say your answer out loud for 60 seconds, then rate yourself.</div>';
  INTERVIEW_QS.forEach(function(q,i){
    const self=STATE.interviewSelf[i]||{};
    h+='<div class="card"><h3 style="font-size:15px;">'+(i+1)+'. '+q+'</h3>';
    h+='<div class="timerctrls" style="margin:8px 0;"><button class="btn ghost" data-interviewtimer="'+i+'">▶ 60-second timer</button><span class="timerdisplay" style="font-size:24px;margin:0;" id="itmr-'+i+'"></span></div>';
    h+='<div class="grid2"><div class="field"><label class="f">Confidence (1-5)</label><select data-iself="'+i+'-conf">';
    [1,2,3,4,5].forEach(function(n){ h+='<option '+(self.conf==n?'selected':'')+'>'+n+'</option>'; });
    h+='</select></div><div class="field"><label class="f">Clarity (1-5)</label><select data-iself="'+i+'-clarity">';
    [1,2,3,4,5].forEach(function(n){ h+='<option '+(self.clarity==n?'selected':'')+'>'+n+'</option>'; });
    h+='</select></div></div><div class="field"><label class="f">Technical correctness (1-5)</label><select data-iself="'+i+'-tech">';
    [1,2,3,4,5].forEach(function(n){ h+='<option '+(self.tech==n?'selected':'')+'>'+n+'</option>'; });
    h+='</select></div><div class="field"><label class="f">What should I improve?</label><textarea rows="2" data-iself="'+i+'-note">'+(self.note||'')+'</textarea></div></div>';
  });
  return h;
}

function pageSettings(){
  const s=STATE.settings;
  let h='<h2 class="sectiontitle">Settings</h2>';
  h+='<div class="card"><h3 style="font-size:15px;margin-bottom:8px;">Key dates</h3>';
  h+='<div class="field"><label class="f">Registration deadline</label><input type="date" id="setReg" value="'+s.reg+'"></div>';
  h+='<div class="field"><label class="f">Aptitude / OA date</label><input type="date" id="setOa" value="'+s.oa+'"></div>';
  h+='<div class="field"><label class="f">Interview date</label><input type="date" id="setInterview" value="'+s.interview+'"></div>';
  h+='<div class="field"><label class="f">Daily focused-hours target (5–7 recommended)</label><input type="number" id="setHours" value="'+s.dailyHours+'" min="1" max="10"></div>';
  h+='<button class="btn sage" id="saveSettings">Save</button></div>';
  h+='<div class="card"><h3 style="font-size:15px;margin-bottom:8px;">Backup your progress</h3><p class="taskmeta">Copy this JSON somewhere safe, or paste an older backup below to restore it.</p>';
  h+='<textarea rows="5" id="exportBox" readonly>'+JSON.stringify(STATE)+'</textarea><button class="btn ghost" id="copyExport" style="margin-top:8px;">Copy to clipboard</button></div>';
  h+='<div class="card"><h3 style="font-size:15px;margin-bottom:8px;">Restore from backup</h3><textarea rows="5" id="importBox" placeholder="Paste backup JSON here"></textarea><button class="btn gold" id="importBtn" style="margin-top:8px;">Restore</button></div>';
  h+='<div class="card"><button class="btn danger" id="resetAll">Reset all progress</button></div>';
  return h;
}

/* ================= WIRING ================= */
function wirePage(id){
  document.querySelectorAll('[data-task]').forEach(function(cb){
    cb.addEventListener('change', function(e){
      STATE.tasksDone[e.target.dataset.task]=e.target.checked; save();
      e.target.closest('.taskrow').classList.toggle('done', e.target.checked);
      if(e.target.checked){ toast(randomMotiv()); maybeConfetti(); }
    });
  });
  document.querySelectorAll('[data-mood]').forEach(function(b){ b.addEventListener('click',function(e){
    const today=new Date().toISOString().slice(0,10);
    STATE.moodLog[today]=e.target.dataset.mood; save();
    if(['😔','😣'].indexOf(e.target.dataset.mood)>=0) toast("That's okay. Let's take it lighter today — protecting P0 topics only.");
    render();
  }); });
  const emB=document.getElementById('emergencyBtn');
  if(emB) emB.addEventListener('click',function(){
    let panel='<div class="card" style="background:var(--gold-soft);border:none;"><h3 style="font-size:15px;">Top 5 things to study right now</h3><ol>';
    EMERGENCY_TOP5.forEach(function(t){ panel+='<li style="margin-bottom:4px;">'+t+'</li>'; });
    panel+='</ol><button class="btn ghost" id="lostMotivBtn">I\'ve lost motivation instead</button></div>';
    document.getElementById('emergencyPanel').innerHTML=panel;
    document.getElementById('lostMotivBtn').addEventListener('click',function(){
      document.getElementById('emergencyPanel').innerHTML='<div class="card" style="background:var(--lav-soft);border:none;"><p style="font-family:\'Fraunces\',serif;font-style:italic;">Don\'t think about the whole internship. Just solve ONE easy problem.</p><button class="btn sage" data-nav="timer">15-minute reset →</button></div>';
    });
  });
  if(id==='today'){
    const sb=document.getElementById('saveCheckout');
    if(sb) sb.addEventListener('click',function(){
      const plan=todayPlan();
      STATE.checkoutLog[plan.date]={co1:document.getElementById('co1').value, co2:document.getElementById('co2').value};
      save(); toast("Enough for today. Close the laptop — tomorrow we continue. 💛");
    });
  }
  if(id==='timer') wireTimer();
  if(id==='dsa'){
    document.querySelectorAll('[data-dsastatus]').forEach(function(sel){ sel.addEventListener('change',function(e){
      STATE.dsaStatus[e.target.dataset.dsastatus]=+e.target.value; save();
    }); });
  }
  if(id==='projects'){
    document.querySelectorAll('[data-flip]').forEach(function(f){ f.addEventListener('click',function(){
      const k=f.dataset.flip; flipStates[k]=!flipStates[k]; f.classList.toggle('flipped');
    }); });
  }
  if(id==='confidence'){
    document.querySelectorAll('[data-conf]').forEach(function(sel){ sel.addEventListener('change',function(e){
      STATE.confidence[e.target.dataset.conf]=+e.target.value; save(); render();
    }); });
  }
  if(id==='mocks'){
    const btn=document.getElementById('addMock');
    if(btn) btn.addEventListener('click',function(){
      const sections={}; const vals=[];
      MOCK_SECTIONS.forEach(function(s){ const v=+(document.getElementById('mock-'+s).value||0); sections[s]=v; vals.push(v); });
      const total=Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
      STATE.mocks.push({date:new Date().toISOString().slice(0,10),sections:sections,total:total}); save(); render();
    });
  }
  if(id==='mistakes'){
    const btn=document.getElementById('addMistake');
    if(btn) btn.addEventListener('click',function(){
      STATE.mistakes.push({date:new Date().toISOString().slice(0,10),topic:val('mTopic'),q:val('mQ'),mine:val('mMine'),correct:val('mCorrect'),why:val('mWhy'),category:val('mCat')});
      save(); render();
    });
  }
  if(id==='notes'){
    const btn=document.getElementById('addNote');
    if(btn) btn.addEventListener('click',function(){
      STATE.notes.push({date:new Date().toISOString().slice(0,10),topic:val('nTopic'),link:val('nLink'),text:val('nText')});
      save(); render();
    });
  }
  if(id==='interview'){
    document.querySelectorAll('[data-iself]').forEach(function(el){ el.addEventListener('change',function(e){
      const parts=e.target.dataset.iself.split('-'); const i=parts[0], field=parts[1];
      STATE.interviewSelf[i]=STATE.interviewSelf[i]||{};
      STATE.interviewSelf[i][field]=e.target.value; save();
    }); });
    document.querySelectorAll('[data-interviewtimer]').forEach(function(b){ b.addEventListener('click',function(e){
      const i=e.target.dataset.interviewtimer; let left=60;
      const disp=document.getElementById('itmr-'+i);
      clearInterval(b._h);
      disp.textContent=fmtTime(left);
      b._h=setInterval(function(){ left--; disp.textContent=fmtTime(Math.max(left,0)); if(left<=0){ clearInterval(b._h); toast('Time — how did that feel?'); } },1000);
    }); });
  }
  if(id==='settings'){
    document.getElementById('saveSettings').addEventListener('click',function(){
      STATE.settings={reg:val('setReg'),oa:val('setOa'),interview:val('setInterview'),dailyHours:+val('setHours')};
      save(); toast('Settings saved.'); render();
    });
    document.getElementById('copyExport').addEventListener('click',function(){
      navigator.clipboard.writeText(document.getElementById('exportBox').value).then(function(){ toast('Copied.'); });
    });
    document.getElementById('importBtn').addEventListener('click',function(){
      try{ const parsed=JSON.parse(val('importBox')); STATE=Object.assign(loadState(),parsed); save(); toast('Restored.'); render(); }
      catch(e){ toast('That JSON could not be read.'); }
    });
    document.getElementById('resetAll').addEventListener('click',function(){
      if(confirm('Reset everything? This cannot be undone.')){ localStorage.removeItem(SKEY); STATE=loadState(); render(); }
    });
  }
}
function val(id){ return document.getElementById(id).value; }
function maybeConfetti(){
  const plan=todayPlan();
  const doneCount=plan.items.filter(function(it,i){return STATE.tasksDone[taskId(plan.date,i)];}).length;
  if(doneCount===plan.items.length) confettiBurst();
}

function wireTimer(){
  document.querySelectorAll('[data-preset]').forEach(function(b){ b.addEventListener('click',function(){ setTimerMinutes(+b.dataset.preset); }); });
  document.getElementById('customStart').addEventListener('click',function(){
    const m=+document.getElementById('customMin').value; if(m>0) setTimerMinutes(m);
  });
  document.getElementById('tmStart').addEventListener('click',startTimer);
  document.getElementById('tmPause').addEventListener('click',pauseTimer);
  document.getElementById('tmReset').addEventListener('click',resetTimer);
  document.getElementById('tmFinish').addEventListener('click',finishTimer);
  document.getElementById('tmTopic').addEventListener('change',function(e){ timerState.topic=e.target.value; });
  document.getElementById('tmTask').addEventListener('input',function(e){ timerState.task=e.target.value; });
  updateTimerDisplay();
}
function setTimerMinutes(m){ timerState.remaining=m*60; timerState.total=m*60; updateTimerDisplay(); }
function startTimer(){
  if(timerState.running && !timerState.paused) return;
  timerState.running=true; timerState.paused=false;
  clearInterval(timerState.interval);
  timerState.interval=setInterval(function(){
    timerState.remaining--;
    if(timerState.remaining<=0){ clearInterval(timerState.interval); timerState.running=false; toast('Session complete! Log it below.'); }
    updateTimerDisplay();
  },1000);
  const n=document.getElementById('tmNote'); if(n) n.textContent='';
}
function pauseTimer(){
  if(!timerState.running) return;
  if(!timerState.paused){ timerState.paused=true; clearInterval(timerState.interval); const n=document.getElementById('tmNote'); if(n) n.textContent='Paused 💛 Take care of what you need. Come back when ready.'; }
  else{ timerState.paused=false; startTimer(); const n=document.getElementById('tmNote'); if(n) n.textContent="Welcome back. Let's finish this one."; }
  const pb=document.getElementById('tmPause'); if(pb) pb.textContent=timerState.paused?'Resume':'Pause';
}
function resetTimer(){ clearInterval(timerState.interval); const tt=timerState.total; timerState={running:false,paused:false,remaining:tt,total:tt,topic:timerState.topic,task:timerState.task,interval:null}; updateTimerDisplay(); }
function finishTimer(){
  clearInterval(timerState.interval);
  const doneMin=Math.round((timerState.total-timerState.remaining)/60) || Math.round(timerState.total/60);
  if(doneMin>0){
    STATE.timerLog.push({date:new Date().toISOString().slice(0,10),topic:timerState.topic,task:timerState.task,min:doneMin});
    save(); toast(BREAK_MSG[Math.floor(Math.random()*BREAK_MSG.length)]);
  }
  timerState.running=false; timerState.paused=false; timerState.remaining=timerState.total;
  render();
}
function updateTimerDisplay(){
  const d=document.getElementById('tmDisplay'); if(d) d.textContent=fmtTime(Math.max(timerState.remaining,0));
}

/* ================= INIT ================= */
render();
</script>
